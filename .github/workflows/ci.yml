name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r service/requirements.lock
      - run: pip install -r service/requirements-dev.txt pip-audit
      - run: pip-audit -r service/requirements.lock
      - run: PYTHONPATH=service pytest -q service/tests
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24' }
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker compose up -d --build
      - run: bash scripts/e2e.sh
      - if: always()
        run: docker compose logs --no-color --tail=200 && docker compose down -v
